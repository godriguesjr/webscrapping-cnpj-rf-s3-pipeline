name: verificar segredos

on:
  push:
  pull_request:

jobs:
  varrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: varrer repositório
        run: python scripts/verificar-segredos.py
